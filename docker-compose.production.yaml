services:
  web:
    container_name: evoting.web.production
    image: ${DOCKER_REGISTRY}/web:${IMAGE_VERSION}
    build:
      context: .
      dockerfile: ops/production/Dockerfile
      target: web
    restart: always
    ports:
      - "${DOCKER_HOST:-127.0.0.1:8000}:80"
    volumes:
      - .:/opt/apps/evoting:ro
    depends_on:
      - fpm
    networks:
      - evoting

  fpm:
    container_name: evoting.fpm.production
    image: ${DOCKER_REGISTRY}/fpm:${IMAGE_VERSION}
    build:
      context: .
      dockerfile: ops/production/Dockerfile
      target: fpm
    restart: always
    volumes:
      - .:/opt/apps/evoting
    env_file:
      - .env
    depends_on:
      - mysql
      - redis
    networks:
      - evoting

  mysql:
    container_name: evoting.mysql.production
    image: mysql:8.2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evoting
    command: >
      --max_connections=500
      --innodb_buffer_pool_size=4096M
      --innodb_log_file_size=256M
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - evoting

  redis:
    container_name: evoting.redis.production
    image: redis:6.0
    restart: always
    volumes:
      - redis:/data
    networks:
      - evoting

networks:
  evoting:
    driver: bridge

volumes:
  mysql:
    name: evoting.mysql.production
  redis:
    name: evoting.redis.production
