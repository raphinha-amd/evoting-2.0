services:
  # We need to run the FPM container for our application
  fpm:
    restart: always
    container_name: evoting.fpm.production
    build:
      context: .
      dockerfile: ops/production/fpm.Dockerfile
    image: ${DOCKER_REGISTRY}/fpm:${IMAGE_VERSION}
    # We can override any env values here.
    # By default the .env in the project root will be loaded as the environment for all containers
    # environment:
    #   APP_DEBUG: "true"
    # Mount the codebase, so any code changes we make will be propagated to the running application
    volumes:
      # Here we mount in our codebase so any changes are immediately reflected into the container
      - '.:/opt/apps/evoting'
    networks:
      - evoting

  # Run the web server container for static content, and proxying to our FPM container
  web:
    restart: always
    container_name: evoting.web.production
    build:
      context: .
      dockerfile: ops/production/web.Dockerfile
    image: ${DOCKER_REGISTRY}/web:${IMAGE_VERSION}
    # Expose our application port (80) through a port on our local machine (8080)
    ports:
      - "${DOCKER_HOST:-127.0.0.1:8080}:80"
    environment:
      FPM_HOST: "fpm:9000"
    volumes:
      - ".:/opt/apps/evoting"
    depends_on:
      - fpm
      - mysql
    networks:
      - evoting

  mysql:
    restart: always
    container_name: evoting.mysql.production
    image: mysql:8.2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evoting
    volumes:
      - 'mysql:/var/lib/mysql'
      - '.:/opt/apps/evoting'
    networks:
      - evoting
    command: --max_connections=500 --innodb_buffer_pool_size=8096M --innodb_log_file_size=256M
    healthcheck:
      test: [
        "CMD",
        "mysqladmin",
        "ping",
        "-p${DB_PASSWORD}"
      ]
      retries: 3
      timeout: 5s

  redis:
    restart: always
    container_name: evoting.redis.production
    image: redis:6.0
    networks:
      - evoting
    volumes:
      - 'redis:/data'
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]

networks:
  evoting:
    name: evoting
    driver: bridge

volumes:
  mysql:
    name: evoting.mysql.production
  redis:
    name: evoting.redis.production
